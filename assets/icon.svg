<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C3546"/><stop offset="1" stop-color="#151A23"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13294A"/><stop offset="1" stop-color="#0A1627"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#gloss)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
  <g filter="url(#sh)">
    <!-- background tabs -->
    <path d="M52 98 V72 a11 11 0 0 1 11-11 h34 a11 11 0 0 1 11 11 V98 Z" fill="#E0453F"/>
    <path d="M104 98 V72 a11 11 0 0 1 11-11 h34 a11 11 0 0 1 11 11 V98 Z" fill="#F2B21B"/>
    <!-- window -->
    <rect x="36" y="88" width="184" height="128" rx="20" fill="url(#win)" stroke="#2F8BEA" stroke-width="5"/>
    <!-- active tab, fused to window -->
    <path d="M156 96 V66 a13 13 0 0 1 13-13 h37 a13 13 0 0 1 13 13 V96 Z" fill="#2F8BEA"/>
    <rect x="156" y="84" width="63" height="10" fill="#2F8BEA"/>
  </g>
  <!-- prompt -->
  <polyline points="72,130 98,151 72,172" fill="none" stroke="#8FD0FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="162" width="46" height="13" rx="6.5" fill="#EAF3FD"/>
</svg>
